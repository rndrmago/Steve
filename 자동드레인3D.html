<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동드레인장치 3D</title>
<style>
:root{
  --bg:#eef1f4; --panel:rgba(255,255,255,.94); --ink:#1d2329; --muted:#5d6873; --line:#d6dbe1;
  --accent:#1565c0; --accent-ink:#fff; --warn:#c62828; --ok:#2e7d32; --chip:#f3f5f8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16191d; --panel:rgba(30,34,39,.95); --ink:#e7ebef; --muted:#9aa5b1; --line:#353c44;
    --accent:#64a8f0; --accent-ink:#0d1620; --warn:#ef6b6b; --ok:#6cc070; --chip:#252a30;
  }
}
:root[data-theme="dark"]{
  --bg:#16191d; --panel:rgba(30,34,39,.95); --ink:#e7ebef; --muted:#9aa5b1; --line:#353c44;
  --accent:#64a8f0; --accent-ink:#0d1620; --warn:#ef6b6b; --ok:#6cc070; --chip:#252a30;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:13px}
#view{position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 24px rgba(0,0,0,.12);backdrop-filter:blur(6px)}
#ctrl{left:12px;top:12px;width:270px;max-height:calc(100% - 24px);overflow:auto;padding:12px 14px}
#info{right:12px;top:12px;width:360px;max-height:calc(100% - 24px);display:flex;flex-direction:column}
h1{font-size:15px;margin:0 0 2px}
.sub{color:var(--muted);font-size:11.5px;margin-bottom:10px;line-height:1.45}
.grp{margin:10px 0 0}
.grp>label.t{display:block;font-weight:600;font-size:12px;margin-bottom:5px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--chip);color:var(--ink);padding:6px 4px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.btns button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;padding:5px 9px;font:inherit;cursor:pointer}
.btns button:hover,.seg button:hover:not(.on){filter:brightness(.96)}
.chk{display:flex;align-items:center;gap:6px;margin:4px 0;cursor:pointer}
input[type=range]{width:100%}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px 6px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabbody{overflow:auto;padding:8px 12px 12px}
.part{display:flex;gap:8px;padding:6px 6px;border-radius:6px;cursor:pointer;align-items:flex-start}
.part:hover,.part.on{background:var(--chip)}
.pn{flex:0 0 26px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.part b{font-weight:600}
.part small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.err{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;cursor:pointer}
.err:hover{background:var(--chip)}
.err .h{display:flex;gap:6px;align-items:center;font-weight:600}
.tag{font-size:10.5px;padding:1px 6px;border-radius:8px;border:1px solid currentColor;white-space:nowrap}
.tag.fix{color:var(--ok)} .tag.note{color:var(--muted)} .tag.risk{color:var(--warn)}
.err p{margin:5px 0 0;color:var(--muted);line-height:1.5;font-size:12px}
.err p em{color:var(--ink);font-style:normal;font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;display:none;z-index:5;box-shadow:0 3px 10px rgba(0,0,0,.15)}
#help{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);color:var(--muted);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 12px;white-space:nowrap}
#mode{position:fixed;left:50%;top:12px;transform:translateX(-50%);font-weight:700;padding:5px 14px;border-radius:14px;font-size:12.5px;border:1px solid var(--line);background:var(--panel)}
#mode.c{color:var(--ok)} #mode.o{color:var(--warn)}
.balloon{width:22px;height:22px;border-radius:11px;background:#fff;border:1.5px solid #1565c0;color:#1565c0;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.dim{background:rgba(255,255,255,.92);color:#0d47a1;border:1px solid #90caf9;border-radius:4px;font-size:11px;padding:1px 5px;white-space:nowrap;font-weight:600}
.mark{font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap;color:#fff}
.mark.bad{background:#c62828}.mark.good{background:#2e7d32}
.legend{font-size:11.5px;color:var(--muted);line-height:1.6}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
#mbar{display:none}
@media (max-width: 900px){
  #ctrl{display:none;width:auto;left:8px;right:8px;top:auto;bottom:50px;max-height:40%;padding:8px 10px;font-size:12px}
  body.menu-open #ctrl{display:block}
  #ctrl h1{font-size:13px} #ctrl .sub{font-size:10.5px;margin-bottom:4px}
  #ctrl .grp{margin-top:7px}
  #info{display:none}
  #help{display:none}
  #mode{top:6px;font-size:10.5px;padding:2px 9px}
  #mbar{display:flex;position:fixed;left:8px;bottom:8px;gap:6px;z-index:6}
  #mbar button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:6px 11px;font:inherit;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  #mbar button.on{background:var(--accent);color:var(--accent-ink)}
  .balloon{width:18px;height:18px;font-size:9.5px}
  .dim{font-size:9.5px} .mark{font-size:9px;padding:2px 5px}
}
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>
<div id="loading">3D 모델 불러오는 중…</div>
<div id="mode" class="c">보정안</div>

<div id="ctrl" class="panel">
  <h1>자동드레인장치 3D 모델</h1>
  <div class="sub">DW-XNI-261006-201-01-00 · 외함 1050×1200×450 (SUS304)<br>원본: 자동드레인 클로드.dxf · 도어: 왼쪽문/오른쪽문 DXF · 단위 mm</div>

  <div class="grp"><label class="t">모델 기준</label>
    <div class="seg" id="segMode"><button data-v="1" class="on">보정안</button><button data-v="0">원도면 그대로</button></div>
  </div>
  <div class="grp"><label class="t">외함 표시</label>
    <div class="seg" id="segEnc"><button data-v="opaque" class="on">불투명</button><button data-v="glass">반투명</button><button data-v="hide">숨김</button></div>
  </div>
  <div class="grp"><label class="t">도어 · 잠금장치 구동</label>
    <div class="btns"><button id="unlock">▶ 잠금 해제 · 열기</button><button id="lock">◀ 닫고 잠그기</button></div>
    <div class="btns" style="margin-top:5px"><button id="mechView">핸들·활대 기구 확대 보기</button></div>
    <div class="sub" id="mechState" style="margin:6px 0 4px;min-height:32px"></div>
    <label class="t">도어 열림 <span id="doorVal">0°</span></label>
    <input type="range" id="door" min="0" max="110" value="0">
  </div>
  <div class="grp"><label class="t">시점</label>
    <div class="btns" id="views"><button data-v="iso">등각</button><button data-v="front">정면</button><button data-v="top">평면</button><button data-v="right">우측면</button><button data-v="back">후방</button></div>
    <label class="chk"><input type="checkbox" id="ortho"> 정투영 (도면처럼 보기)</label>
  </div>
  <div class="grp"><label class="t">표시</label>
    <label class="chk"><input type="checkbox" id="ovl"> 2D 원도면 겹쳐보기</label>
    <label class="chk"><input type="checkbox" id="lbl" checked> 부품번호 · 치수</label>
    <label class="chk"><input type="checkbox" id="flow"> 물 흐름 방향</label>
    <div class="legend" id="ovlLegend" style="display:none"><i style="color:#0b57d0"></i>외형선 <i style="color:#9e9e9e"></i>숨은선 <i style="color:#e65100"></i>중심선<br>정투영 + 정면/평면/우측면 시점에서 비교하세요.</div>
  </div>
  <div class="grp"><label class="t">내보내기</label>
    <div class="btns"><button id="glb">GLB 저장</button><button id="stl">STL 저장</button></div>
  </div>
</div>

<div id="info" class="panel">
  <div class="tabs"><button data-t="err" class="on">도면 오류 · 보정</button><button data-t="bom">부품표</button></div>
  <div class="tabbody" id="tab-err"></div>
  <div class="tabbody" id="tab-bom" style="display:none"></div>
</div>
<div id="mbar"><button id="mMenu">☰ 메뉴</button><button id="mOpen">▶ 열기</button><button id="mLock">◀ 잠금</button></div>
<div id="tip"></div>
<div id="help">왼쪽 드래그: 회전 · 오른쪽 드래그: 이동 · 휠: 확대 · 부품 클릭: 강조</div>

function add(parent, geo, mat, part, pos) {
  const m = new THREE.Mesh(geo, mat); m.userData.part = part;
  if (pos) m.position.copy(pos);
  parent.add(m); return m;
}
// 중심/크기 박스 (부모 좌표)
function box(parent, part, mat, x0, x1, y0, y1, z0, z1, r = 0) {
  const w = Math.abs(x1 - x0), h = Math.abs(y1 - y0), d = Math.abs(z1 - z0);
  const g = r > 0 ? new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - .01, h / 2 - .01, d / 2 - .01)) : new THREE.BoxGeometry(w, h, d);
  return add(parent, g, mat, part, new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2));
}

function cylY(p, part, mat, r, y0, y1, x = 0, z = 0, seg = 48) {
  return add(p, new THREE.CylinderGeometry(r, r, y1 - y0, seg), mat, part, new THREE.Vector3(x, (y0 + y1) / 2, z));
}
function cylX(p, part, mat, r, x0, x1, y = 0, z = 0, seg = 48) {

}
function cylZ(p, part, mat, r, z0, z1, x = 0, y = 0, seg = 48) {

}

function pipeGeoY(ro, ri, L) {
  const g = new THREE.Group();
  const o = new THREE.Mesh(new THREE.CylinderGeometry(ro, ro, L, 48, 1, true), M.pipe);
  const i = new THREE.Mesh(new THREE.CylinderGeometry(ri, ri, L, 48, 1, true), M.inner);
  const r1 = new THREE.Mesh(new THREE.RingGeometry(ri, ro, 48), M.pipe); r1.rotation.x = -Math.PI / 2; r1.position.y = L / 2;
  const r2 = new THREE.Mesh(new THREE.RingGeometry(ri, ro, 48), M.pipe); r2.rotation.x = Math.PI / 2; r2.position.y = -L / 2;
  g.add(o, i, r1, r2); return g;
}
function pipeY(p, part, y0, y1, x = 0, z = 0) {
  const g = pipeGeoY(44.55, 42.45, y1 - y0); g.position.set(x, (y0 + y1) / 2, z);
  g.traverse(o => { if (o.isMesh) o.userData.part = part; }); p.add(g); return g;
}
function pipeX(p, part, x0, x1, y, z = 0) {
  const g = pipeGeoY(44.55, 42.45, x1 - x0); g.rotation.z = Math.PI / 2; g.position.set((x0 + x1) / 2, y, z);

  g.rotation.z = rotZ; g.position.set(cx, cy, 0);
  g.traverse(o => { if (o.isMesh) o.userData.part = part; }); p.add(g); return g;
}

function flangeGeo(D, bore, t, holes = true, pcd = 150, hd = 19) {
  const s = new THREE.Shape(); s.absarc(0, 0, D / 2, 0, Math.PI * 2, false);
  const b = new THREE.Path(); b.absarc(0, 0, bore / 2, 0, Math.PI * 2, true); s.holes.push(b);
  if (holes) for (let k = 0; k < 8; k++) {
    const a = (22.5 + 45 * k) * deg, h = new THREE.Path();
    h.absarc(pcd / 2 * Math.cos(a), pcd / 2 * Math.sin(a), hd / 2, 0, Math.PI * 2, true); s.holes.push(h);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 40 });
  g.rotateX(-Math.PI / 2); return g;
}
function flangeY(p, part, mat, y0, t, D = 185, bore = 89.1, holes = true, x = 0, z = 0) {
  return add(p, flangeGeo(D, bore, t, holes), mat, part, new THREE.Vector3(x, y0, z));
}
function revolve(p, part, mat, prof, seg = 64) {

function loftX(p, part, mat, x0, ry0, rz0, x1, ry1, rz1, y, z, seg = 40) {
  const pos = [], idx = [];
  for (let i = 0; i < 2; i++) {
    const x = i ? x1 : x0, ry = i ? ry1 : ry0, rz = i ? rz1 : rz0;
    for (let j = 0; j <= seg; j++) { const a = j / seg * Math.PI * 2; pos.push(x, y + Math.cos(a) * ry, z + Math.sin(a) * rz); }
  }
  for (let j = 0; j < seg; j++) { const a = j, b = j + 1, c = seg + 1 + j, d = seg + 2 + j; idx.push(a, c, b, b, c, d); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return add(p, g, mat, part);
}

  const camRot = (1 - turn) * Math.PI / 2;
  for (const g of rigs) {

  if (id) { tip.style.display = 'block'; tip.style.left = ev.clientX + 14 + 'px'; tip.style.top = ev.clientY + 12 + 'px'; tip.innerHTML = `<b>${id.slice(1).replace(/^0/, '')}. ${PARTS[id][0]}</b><br><span style="color:var(--muted)">${PARTS[id][1]}</span>`; }
  else tip.style.display = 'none';
});
let downAt = null;
renderer.domElement.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', ev => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 4) return;
  const id = pick(ev); highlight(id === selected ? null : id);
});

/* ───────── UI ───────── */
const $ = (s) => document.querySelector(s);
function seg(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v); });
}
seg('segMode', v => { S.corrected = v === '1'; const sel = selected; build(); if (sel) highlight(sel); const m = $('#mode'); m.textContent = S.corrected ? '보정안' : '원도면 그대로 (오류 포함)'; m.className = S.corrected ? 'c' : 'o'; });
seg('segEnc', v => { S.enc = v; applyEnc(); });
$('#door').addEventListener('input', e => { mechTarget = null; const v = +e.target.value; mechS = v > 0 ? T_OPEN + v / OPEN_DEG * OPEN_SEC : Math.min(mechS, T_OPEN); applyMech(); });
$('#unlock').addEventListener('click', () => { mechTarget = T_OPEN + OPEN_SEC; });
$('#lock').addEventListener('click', () => { if (mechS > T_OPEN + OPEN_SEC) mechS = T_OPEN + OPEN_SEC; mechTarget = 0; });
$('#mechView').addEventListener('click', () => {
  if (S.enc !== 'glass') { S.enc = 'glass'; document.querySelectorAll('#segEnc button').forEach(b => b.classList.toggle('on', b.dataset.v === 'glass')); applyEnc(); }
  goView([0.55, 0.2, 1], [W(470, 640, 0).x, 640, W(470, 640, 0).z], 760);
});
$('#views').addEventListener('click', e => { const b = e.target.closest('button'); if (b) goView(VIEWDIR[b.dataset.v]); });
$('#ortho').addEventListener('change', e => {
  S.ortho = e.target.checked;
  const pos = camera.position.clone(), tgt = controls.target.clone();
  camera = S.ortho ? orthoCam : perspCam;
  camera.position.copy(pos); camera.lookAt(tgt);
  if (S.ortho) { camera.zoom = 3300 / pos.distanceTo(tgt); camera.updateProjectionMatrix(); }
  controls.object = camera; controls.update();
});
$('#ovl').addEventListener('change', e => { S.overlay = e.target.checked; $('#ovlLegend').style.display = S.overlay ? 'block' : 'none'; applyVis(); });
$('#lbl').addEventListener('change', e => { S.labels = e.target.checked; applyVis(); });
$('#flow').addEventListener('change', e => { S.flow = e.target.checked; applyVis(); });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#tab-err').style.display = b.dataset.t === 'err' ? '' : 'none'; $('#tab-bom').style.display = b.dataset.t === 'bom' ? '' : 'none';
}));
$('#tab-bom').innerHTML = Object.entries(PARTS).map(([id, [n, d]]) => `<div class="part" data-id="${id}"><div class="pn">${id.slice(1).replace(/^0/, '')}</div><div><b>${n}</b><small>${d}</small></div></div>`).join('');
$('#tab-bom').addEventListener('click', e => { const p = e.target.closest('.part'); if (p) highlight(p.dataset.id === selected ? null : p.dataset.id); });
const TAGTXT = { fix: '보정 적용', risk: '간섭 · 보정 적용', note: '확인 필요' };
$('#tab-err').innerHTML = `<div class="sub" style="margin:6px 0 2px">조립도 3면도와 부품 상세도를 대조해 찾은 항목입니다. 클릭하면 해당 위치로 이동합니다. 상단 <b>모델 기준</b>에서 원도면과 보정안을 바꿔 볼 수 있습니다.</div>` +
  ERRORS.map(e => `<div class="err" data-id="${e.id}"><div class="h"><span>${e.id}</span><span style="flex:1">${e.title}</span><span class="tag ${e.tag === 'risk' ? 'risk' : e.tag}">${TAGTXT[e.tag]}</span></div><p>${e.body}</p></div>`).join('');
$('#tab-err').addEventListener('click', e => { const el = e.target.closest('.err'); if (!el) return; const er = ERRORS.find(x => x.id === el.dataset.id); if (er && er.focus) focusWorld(er.focus); });

// claude.ai 링크에서는 downloads 기능으로 저장 (glb/stl은 허용 확장자가 아니므로 zip으로 묶음)
let DL = null;
(async () => { try { if (window.claude && window.claude.use) DL = await window.claude.use('downloads'); } catch (e) { DL = null; } })();
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function zipStore(name, data) {
  let crc = 0xFFFFFFFF; for (let i = 0; i < data.length; i++) crc = CRC_T[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8); crc = (crc ^ 0xFFFFFFFF) >>> 0;
  const fn = new TextEncoder().encode(name), L = new DataView(new ArrayBuffer(30)), Cd = new DataView(new ArrayBuffer(46)), E = new DataView(new ArrayBuffer(22));
  L.setUint32(0, 0x04034b50, true); L.setUint16(4, 20, true); L.setUint16(6, 0x0800, true); L.setUint32(14, crc, true); L.setUint32(18, data.length, true); L.setUint32(22, data.length, true); L.setUint16(26, fn.length, true);
  Cd.setUint32(0, 0x02014b50, true); Cd.setUint16(4, 20, true); Cd.setUint16(6, 20, true); Cd.setUint16(8, 0x0800, true); Cd.setUint32(16, crc, true); Cd.setUint32(20, data.length, true); Cd.setUint32(24, data.length, true); Cd.setUint16(28, fn.length, true);
  L.setUint16(12, 0x21, true); Cd.setUint16(14, 0x21, true);   // 1980-01-01
  const cdOff = 30 + fn.length + data.length;
  E.setUint32(0, 0x06054b50, true); E.setUint16(8, 1, true); E.setUint16(10, 1, true); E.setUint32(12, 46 + fn.length, true); E.setUint32(16, cdOff, true);
  return new Blob([L, fn, data, Cd, fn, E], { type: 'application/zip' });
}
async function download(blob, name) {
  if (DL) {
    const zip = zipStore(name, new Uint8Array(await blob.arrayBuffer()));
    try { await DL.save({ filename: name.replace(/\.[^.]+$/, '') + '.zip', data: zip }); }
    catch (e) { if (e && e.code !== 'declined') alert('저장할 수 없습니다: ' + (e.message || e.code)); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function exportRoot() { highlight(null); const sc = new THREE.Scene(); const c = root.clone(true); c.scale.setScalar(0.001); sc.add(c); return sc; } // mm → m
$('#glb').addEventListener('click', () => {
  new GLTFExporter().parse(exportRoot(), r => download(new Blob([r], { type: 'model/gltf-binary' }), `자동드레인장치_${S.corrected ? '보정안' : '원도면'}.glb`), err => alert('GLB 저장 실패: ' + err), { binary: true });
});
$('#stl').addEventListener('click', () => {
  highlight(null); const r = new STLExporter().parse(root, { binary: true });   // STL은 mm 단위 유지
  download(new Blob([r], { type: 'model/stl' }), `자동드레인장치_${S.corrected ? '보정안' : '원도면'}_mm.stl`);
});

/* ───────── 루프 ───────── */
addEventListener('resize', () => {
  perspCam.aspect = aspect(); perspCam.updateProjectionMatrix(); setOrthoFrustum();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if (anim) {
    anim.k = Math.min(1, anim.k + dt * 1.8); const e = 1 - Math.pow(1 - anim.k, 3);
    camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.t0, anim.t1, e);
    if (anim.z1 !== undefined) { camera.zoom = anim.z0 + (anim.z1 - anim.z0) * e; camera.updateProjectionMatrix(); }
    if (anim.k >= 1) anim = null;
  }
  if (mechTarget !== null) {
    const step = dt * 1.0;
    if (Math.abs(mechTarget - mechS) <= step) { mechS = mechTarget; mechTarget = null; }
    else mechS += Math.sign(mechTarget - mechS) * step;
    applyMech();
  }
  if (S.flow && flowCurve) {
    const t = clock.elapsedTime * 0.06;
    flowArrows.forEach((m, i) => {
      const s = (t + i / flowArrows.length) % 1, p = flowCurve.getPointAt(s), tg = flowCurve.getTangentAt(s);
      m.position.copy(p); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tg);
    });
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
// 폰: 패널 접기(☰ 메뉴), 라벨 기본 끔
const NARROW = innerWidth <= 900;
if (NARROW) { S.labels = false; $('#lbl').checked = false; }
$('#mMenu').addEventListener('click', () => { const o = document.body.classList.toggle('menu-open'); $('#mMenu').classList.toggle('on', o); });
$('#mOpen').addEventListener('click', () => $('#unlock').click());
$('#mLock').addEventListener('click', () => $('#lock').click());
build();
camera.position.set(0, 600, 0).add(new THREE.Vector3(1, 0.62, 1.15).normalize().multiplyScalar(3300 * fitK()));
controls.update();
document.getElementById('loading').remove();
loop();
window.__app = { S, build, goView, highlight, scene, controls, get camera() { return camera; },
  snap(dir, tgt, dist) { const d = new THREE.Vector3(...dir).normalize(), t = new THREE.Vector3(...tgt); anim = null;
    controls.target.copy(t); camera.position.copy(t).add(d.multiplyScalar(dist)); if (camera.isOrthographicCamera) { camera.zoom = 3300 / dist; camera.updateProjectionMatrix(); } controls.update(); } };
</script>
